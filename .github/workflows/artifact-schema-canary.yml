name: Artifact schema canary

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 09:00 UTC
    - cron: 0 9 * * 1

permissions: read-all

jobs:
  schema-canary:
    name: Compare published artifact schemas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - name: Compare local schemas with upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/artifact-schema-canary.mjs
