name: dbt v2 artifact compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "29 7 * * 1"
  pull_request:
    paths:
      - "packages/dbt-artifacts-parser/src/compatibility/**"
      - "packages/dbt-artifacts-parser/src/sources/index.ts"
      - "packages/dbt-artifacts-parser/src/run_results/index.ts"
      - "tests/dbt_v2_canary/**"
      - "scripts/check-dbt-v2-canary.mjs"
      - ".github/workflows/dbt_v2_compatibility.yml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt-version:
          - "2.0.0"
          - "latest-2.0"

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install TypeScript dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter dbt-artifacts-parser build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dbt
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.dbt-version }}" == "latest-2.0" ]]; then
            python -m pip install "dbt>=2.0,<2.1"
          else
            python -m pip install "dbt==${{ matrix.dbt-version }}"
          fi
          dbt --version

      - name: Generate dbt v2 artifacts
        shell: bash
        working-directory: tests/dbt_v2_canary
        run: |
          rm -rf target db.db canary_artifacts
          mkdir -p canary_artifacts

          dbt parse --profiles-dir .
          cp target/manifest.json canary_artifacts/manifest.json

          dbt seed --profiles-dir .
          dbt run --profiles-dir . --static-analysis off
          cp target/run_results.json canary_artifacts/run_results.json

          dbt source freshness --profiles-dir . --select source:raw.fresh_events
          cp target/sources.json canary_artifacts/sources.json

          dbt compile --profiles-dir . --write-catalog
          cp target/catalog.json canary_artifacts/catalog.json

      - name: Validate emitted artifacts
        run: |
          node scripts/check-dbt-v2-canary.mjs tests/dbt_v2_canary/canary_artifacts
