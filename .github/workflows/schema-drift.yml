name: Check dbt artifact schema drift

on:
  workflow_dispatch:
  schedule:
    - cron: 17 8 * * 1
  pull_request:
    paths:
      - .github/workflows/schema-drift.yml
      - scripts/check_dbt_schema_drift.py
      - packages/dbt-artifacts-parser/resources/json-schema/**

permissions: read-all

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.13"
      - name: Compare schemas with latest stable dbt Core v1
        env:
          GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
        run: >-
          python scripts/check_dbt_schema_drift.py
          --schema-root packages/dbt-artifacts-parser/resources/json-schema
